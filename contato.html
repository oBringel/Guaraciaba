<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="img/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <meta name="theme-color" content="#0d7f78" />
  <title>Contato e localização – Cartório Arquimedes Bucar</title>
  <meta name="description" content="Endereço, telefone, WhatsApp, e-mail e horário de atendimento." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" />
  <link rel="modulepreload" href="js/app.js" />
  <link rel="modulepreload" href="js/dados.js" />
  <link rel="modulepreload" href="js/layout.js" />
  <link rel="modulepreload" href="js/componentes.js" />
  <link rel="modulepreload" href="js/vinculos.js" />
  <link rel="modulepreload" href="js/paginas.js" />
  <link rel="modulepreload" href="js/transicao.js" />
  <link rel="modulepreload" href="js/utilitarios.js" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/paginas.css" />
  <script>
    document.documentElement.classList.add("js");
    window.setTimeout(function () {
      document.documentElement.classList.add("site-pronto");
    }, 2000);
    // Evita que um toque em "WhatsApp" dispare antes do link ser montado pelo JS.
    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest && e.target.closest("[data-wa]");
      if (!a) return;
      var h = a.getAttribute("href") || "";
      if (/^https?:\/\/wa\.me\//i.test(h)) return; // link pronto
      if (h === "#" || h === "" || h.charAt(0) === "#") { e.preventDefault(); }
    }, true);
  </script>
</head>
<body data-pagina="contato">
  <div id="site-cabecalho"></div>

  <div class="pagina-topo">
    <div class="container">
      <nav class="trilha" aria-label="Você está em">
        <ol class="trilha__lista">
            <li><a href="index.html">Início</a></li>
            <li><span aria-current="page">Contato</span></li>
        </ol>
      </nav>
      <h1>Contato e localização</h1>
      <p class="pagina-topo__resumo">Endereço, telefones, e-mail e horário de atendimento da serventia.</p>
    </div>
  </div>

  <main class="container conteudo" id="conteudo">
    <section class="secao" aria-labelledby="titulo-contato">
      <h2 class="apenas-leitor" id="titulo-contato">Contato e localização</h2>
      <div data-render="contato"></div>
    </section>
  </main>

  <div id="site-rodape"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
