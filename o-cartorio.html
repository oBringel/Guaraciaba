<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O Cartório – Cartório Arquimedes Bucar</title>
  <meta name="description" content="Apresentação, missão, valores e dados oficiais da serventia de Guaraciaba do Norte." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" />
  <link rel="modulepreload" href="js/app.js" />
  <link rel="modulepreload" href="js/dados.js" />
  <link rel="modulepreload" href="js/layout.js" />
  <link rel="modulepreload" href="js/componentes.js" />
  <link rel="modulepreload" href="js/vinculos.js" />
  <link rel="modulepreload" href="js/paginas.js" />
  <link rel="modulepreload" href="js/transicao.js" />
  <link rel="modulepreload" href="js/utilitarios.js" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/paginas.css" />
  <script>
    document.documentElement.classList.add("js");
    window.setTimeout(function () {
      document.documentElement.classList.add("site-pronto");
    }, 2000);
    // Evita que um toque em "WhatsApp" dispare antes do link ser montado pelo JS.
    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest && e.target.closest("[data-wa]");
      if (!a) return;
      var h = a.getAttribute("href") || "";
      if (/^https?:\/\/wa\.me\//i.test(h)) return; // link pronto
      if (h === "#" || h === "" || h.charAt(0) === "#") { e.preventDefault(); }
    }, true);
  </script>
</head>
<body data-pagina="o-cartorio">
  <div id="site-cabecalho"></div>

  <div class="pagina-topo">
    <div class="container">
      <nav class="trilha" aria-label="Você está em">
        <ol class="trilha__lista">
            <li><a href="index.html">Início</a></li>
            <li><span aria-current="page">O Cartório</span></li>
        </ol>
      </nav>
      <h1>O Cartório</h1>
      <p class="pagina-topo__resumo">Apresentação da serventia, suas atribuições e os dados oficiais de identificação.</p>
    </div>
  </div>

<main class="container conteudo" id="conteudo">
    <section class="secao" aria-labelledby="titulo-quem">
      <h2 class="secao__titulo" id="titulo-quem">Quem somos</h2>
      <div class="prosa" data-render="apresentacao"></div>
    </section>

    <section class="secao" aria-labelledby="titulo-mvv">
      <h2 class="secao__titulo" id="titulo-mvv">
        Missão, visão e valores
      </h2>
      <div data-render="missao-visao-valores"></div>
    </section>

    <section class="secao" aria-labelledby="titulo-dados">
      <h2 class="secao__titulo" id="titulo-dados">Dados da serventia</h2>
      <div data-render="dados-serventia"></div>
    </section>

    <section class="secao" aria-label="Aviso sobre registro civil">
      <div data-render="aviso-rcpn"></div>
    </section>
</main>


  <div id="site-rodape"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
